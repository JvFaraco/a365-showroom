<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070f" />
    <title>Alarme 365 · Showroom 3D</title>
    <!-- Primeira imagem antes do 3D: uma foto estática da abertura (gerada do próprio app por tools/poster.mjs),
         com o título e o botão já no lugar. Tudo inline: aparece no primeiro quadro, antes de qualquer JS.
         Quando o 3D fica pronto, esta camada sai em crossfade e o canvas (igual a ela) aparece por baixo. -->
    <!-- a imagem tem prioridade alta, mas é um <img> comum (decodificação assíncrona): não bloqueia o script -->
    <style>
      html, body { height: 100%; margin: 0; background: #05070f; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        padding: 9vh 16px; box-sizing: border-box; text-align: center; color: #fff; background: #05070f;
        font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 0.5s cubic-bezier(0.2, 0, 0, 1); }
      #boot picture, #boot picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
      #boot > div, #boot > button { position: relative; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 6rem); font-weight: 700; line-height: 1; letter-spacing: -0.025em; text-shadow: 0 4px 30px rgba(61, 102, 224, 0.7); }
      #boot h1 b { color: #F9E000; font-weight: 700; }
      #boot .sub { margin: 12px 0 0; font-size: clamp(1rem, 2.4vw, 1.7rem); color: rgba(255, 255, 255, 0.85); }
      #boot .go { font: inherit; font-weight: 600; font-size: 1.05em; color: #05070f; background: #F9E000; border: 0; border-radius: 999px; padding: 14px 32px; cursor: pointer;
        box-shadow: 0 20px 25px -5px rgba(234, 179, 8, 0.2); transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), opacity 0.15s; }
      #boot .go:active { transform: scale(0.98); }
      #boot .go.wait { opacity: 0.75; }
      #boot .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      #boot .foot { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #boot .bar { width: 200px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; background: #F9E000; transform-origin: left; transform: scaleX(0.04); transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1); }
      #boot .s { font-size: 11px; color: rgba(255, 255, 255, 0.6); min-height: 1.2em; }
      @media (prefers-reduced-motion: reduce) { #boot, #boot .bar i, #boot .go { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot">
      <picture>
        <source media="(max-aspect-ratio: 4/5)" srcset="./poster-m.webp" />
        <img src="./poster.webp" alt="" fetchpriority="high" decoding="async" />
      </picture>
      <div>
        <h1>Alarme <b>365</b></h1>
        <p class="sub">Atentos a tudo, o tempo todo.</p>
      </div>
      <button class="go" type="button">Conhecer os equipamentos</button>
      <div class="foot" role="status" aria-label="Carregando">
        <div class="bar" aria-hidden="true"><i></i></div>
        <div class="s" aria-live="polite">Carregando o código</div>
      </div>
    </div>
    <script>
      // progresso real por etapa (código, aparelhos, materiais, preparando); o app chama set() e done()
      window.__boot = {
        go: false,
        set: function (p, label) {
          var bar = document.querySelector('#boot .bar i'), s = document.querySelector('#boot .s')
          if (bar) bar.style.transform = 'scaleX(' + p + ')'
          if (s && label) s.textContent = label
        },
        done: function () {
          var el = document.getElementById('boot')
          if (!el) return
          el.classList.add('out') // crossfade direto para o canvas, que já mostra a mesma cena
          setTimeout(function () { el.remove() }, 550)
        },
      }
      // o botão já aparece na imagem: se clicarem antes de o 3D chegar, o app entra no showroom assim que puder
      document.querySelector('#boot .go').addEventListener('click', function () { window.__boot.go = true; this.classList.add('wait'); this.textContent = 'Abrindo…' })
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
